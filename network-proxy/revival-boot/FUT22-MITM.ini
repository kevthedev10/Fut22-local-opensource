; Audited FIFA 22 local-FUT profile. Besides network/login bring-up, the only
; CardsDLL probes enabled are the two measured no-preview walkout hooks below:
; one captures the actual purchased-items array and one injects its first
; (headline) object into the native pack-opening service.

[Hook]
InitDelay=5000
WaitTimeout=120000
DumpBytes=0

[ProtoSSL]
Connect=0x0000000140C89D60
Send=0
Recv=0

[Redirect]
Count=3
Redirect.0.Hostname=spring18.gosredirector.ea.com
Redirect.0.Address=127.0.0.1
Redirect.0.Port=42230
Redirect.0.Secure=0
Redirect.1.SourcePort=17502
Redirect.1.Address=127.0.0.1
Redirect.1.Port=17502
Redirect.1.Secure=0
Redirect.2.SourcePort=80
Redirect.2.Address=127.0.0.1
Redirect.2.Port=18222
Redirect.2.Secure=0

[Config]
GetInt=0x00000001437949E0
GetStr=0x0000000143794B10
Count=5
Set.0=FUT_ENABLE_MENU=1
Set.1=FUT_DIRECT_BOOT=0
Set.2=BLAZE/ROSTERUPDATE_URL=http://127.0.0.1:18222/roster
Set.3=BLAZE/GAMEPLAY_ATTRIBDB_UPDATE_URL=http://127.0.0.1:18222/roster
Set.4=FUT/ROSTERUPDATE_URL=http://127.0.0.1:18222/roster

[Patch]
Count=4
Patch.0.Name=LoginAdaptor.IsLoggedIntoEA
Patch.0.Address=0x0000000142663580
Patch.0.Expect=FF90D8000000
Patch.0.Bytes=B00190909090
Patch.1.Name=LoginAdaptor.IsLoggedIntoNetwork
Patch.1.Address=0x0000000142663490
Patch.1.Expect=FF90D0000000
Patch.1.Bytes=B00190909090
Patch.2.Name=LoginAdaptor.IsAnyLoggedIntoEA
Patch.2.Address=0x0000000142663628
Patch.2.Expect=FF90E0000000
Patch.2.Bytes=B00190909090
Patch.3.Name=LoginAdaptor.IsLoginInProgress
Patch.3.Address=0x0000000142663DB8
Patch.3.Expect=FF90F8000000
Patch.3.Bytes=30C090909090

[CardsPatch]
Count=1
Patch.0.Name=FUT onboarding stage complete
Patch.0.Rva=0x000413BB
Patch.0.Expect=FF90200B0000
Patch.0.Bytes=B80400000090

[CardsProbe]
; FIFA 22's native walkout path. Probe 6 captures the actual purchased-items
; array after a pack is bought; Probe 5 injects its first (headline) item into
; FutPackOpeningService after CONFIGURE. This avoids retaining Store-tile FUT
; objects, which poisoned the shared card cache and caused loading loops.
Count=7

Probe.5.Name=PackSvcConfigure
Probe.5.Rva=0x003E86A0
Probe.5.Steal=5
Probe.5.Sig=44884C242053
Probe.5.Args4=1
Probe.5.Dump=0x170,0x180,0x188,0x190
Probe.5.InjectItem=1
Probe.5.LogRet=1

Probe.6.Name=FutItemParse
Probe.6.Rva=0x00363620
Probe.6.Steal=5
Probe.6.Sig=48895C241855
Probe.6.Args4=1
Probe.6.LogRet=1
Probe.6.Dump=0x00,0x08,0x10,0x18
Probe.6.CaptureItem=1
; Return address of the purchased-items array parser. The server orders the
; reveal headline first and writes HeadlineIndex=0 after every animated pack.
Probe.6.CaptureRet=0x0037DBCB

[Probe]
FutDllLoad=0

[Adapter]
Call=0

[VTable]
Count=0

[Watch]
Count=0

[ItemScan]
Count=0

[WalkoutScan]
Enabled=0

[CheckRewards]
Enabled=0

[PickInject]
Enabled=0

[Nav]
Enabled=0
